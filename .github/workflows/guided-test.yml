name: Guided Test UI
on:
  push:
    branches: [feat/guided-test-site]
permissions:
  contents: read
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pytest>=8,<9'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - name: Verify native drag geometry
        run: TEST_AI_LOCAL=true npx playwright test tests/ui-regressions.spec.js --grep 'moving a stack through main' --repeat-each=3 --retries=0 --reporter=list
      - run: TEST_AI_LOCAL=true npx playwright test --retries=0 --reporter=list
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: guided-ui-failures
          path: test-results/
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/guided/Dockerfile
          push: true
          build-args: SOURCE_REVISION=${{ github.sha }}
          tags: |
            ghcr.io/mossyhub/mbot-studio:guided-test
            ghcr.io/mossyhub/mbot-studio:guided-${{ github.sha }}
